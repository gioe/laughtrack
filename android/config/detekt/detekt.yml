# Detekt static-analysis config for the LaughTrack Android client.
# `buildUponDefaultConfig = true` is set in the root build, so this file only
# needs to record intentional deviations from detekt's defaults.
build:
  maxIssues: 0

complexity:
  LongMethod:
    active: true
    threshold: 80
  TooManyFunctions:
    active: false

style:
  MagicNumber:
    # Compose layouts use dp/sp literals constantly; flagging them is noise.
    active: false
  ForbiddenComment:
    active: false

formatting:
  # ktlint plugin owns formatting; avoid duplicate findings here.
  active: false
