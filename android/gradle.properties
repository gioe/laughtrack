# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache intentionally left OFF until the full plugin set
# (Hilt/KSP/detekt/ktlint) is verified config-cache-safe on a real build —
# enable it in a follow-up once CI confirms no serialization failures.

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Release versioning — single source of truth, mirroring ios/project.yml's
# MARKETING_VERSION / CURRENT_PROJECT_VERSION split:
#   VERSION_NAME = user-facing marketing version (semantic MAJOR.MINOR.PATCH)
#   VERSION_CODE = monotonically-increasing Play build number (integer)
# app/build.gradle.kts reads these (overridable with -PVERSION_CODE=… /
# -PVERSION_NAME=…). The Fastlane `bump_build_number` lane auto-increments
# VERSION_CODE from the highest code already on Play and rewrites these lines.
VERSION_NAME=0.1.0
VERSION_CODE=1
