# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# configuration-cache intentionally left OFF until the full plugin set
# (Hilt/KSP/detekt/ktlint) is verified config-cache-safe on a real build —
# enable it in a follow-up once CI confirms no serialization failures.

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
