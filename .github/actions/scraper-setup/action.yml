name: Scraper Python setup
description: >-
  Set up Python, cache pip, and install apps/scraper requirements
  (with optional dev deps). Tesseract is intentionally not installed
  here — only OCR-touching workflows should pay that cost; install it
  in the calling workflow as a separate apt-get step.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.13"
  install-dev:
    description: >-
      Set to "true" to also install apps/scraper/requirements-dev.txt
      (test/lint deps). Production workflows leave this false so the
      pip cache key stays stable when only dev deps move.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        # Hashes requirements.txt only — dev deps are excluded so a
        # requirements-dev.txt churn doesn't bust the production cache.
        # scraper-ci.yml previously hashed requirements*.txt; CI gives up
        # that extra invalidation in exchange for a single shared key.
        key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('apps/scraper/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ inputs.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      shell: bash
      working-directory: apps/scraper
      env:
        INSTALL_DEV: ${{ inputs.install-dev }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        if [ "$INSTALL_DEV" = "true" ]; then
          pip install -r requirements-dev.txt
        fi
