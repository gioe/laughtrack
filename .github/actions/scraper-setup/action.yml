name: Scraper Python setup
description: >-
  Set up Python + uv and install apps/scraper from uv.lock via uv sync
  --frozen (with the optional dev dependency group), so CI runs the exact
  pins local dev uses. Tesseract is intentionally not installed here — only
  OCR-touching workflows should pay that cost; install it in the calling
  workflow as a separate apt-get step.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.13"
  install-dev:
    description: >-
      Set to "true" to also install the pyproject [dependency-groups] dev
      group (test/lint deps). Production workflows leave this false so the
      installed set stays minimal.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        # Caches the uv cache dir; a re-lock changes uv.lock and busts the key.
        enable-cache: true
        cache-dependency-glob: apps/scraper/uv.lock

    - name: Install Python dependencies
      shell: bash
      working-directory: apps/scraper
      env:
        INSTALL_DEV: ${{ inputs.install-dev }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        # --frozen installs exactly what uv.lock pins (no re-resolution), so a
        # transitive release can never drift CI away from local dev. The
        # project itself is installed editable into apps/scraper/.venv.
        if [ "$INSTALL_DEV" = "true" ]; then
          uv sync --frozen --python "$PYTHON_VERSION"
        else
          uv sync --frozen --no-dev --python "$PYTHON_VERSION"
        fi
        # Calling workflows invoke bare python / pytest / playwright /
        # bin/migrate and previously relied on pip installing into the
        # setup-python interpreter. uv sync installs into .venv instead, so
        # put the venv first on PATH (and export VIRTUAL_ENV) for every
        # subsequent step in the job.
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
        echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
