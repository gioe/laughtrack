name: Scraper Python setup
description: >-
  Set up Python, cache pip, and install apps/scraper from pyproject.toml
  (with the optional dev dependency group). Tesseract is intentionally not
  installed here — only OCR-touching workflows should pay that cost; install
  it in the calling workflow as a separate apt-get step.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.13"
  install-dev:
    description: >-
      Set to "true" to also install the pyproject [dependency-groups] dev
      group (test/lint deps). Production workflows leave this false so the
      installed set stays minimal.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        # Hashes pyproject.toml — the single dependency manifest since
        # TASK-3711 (runtime deps in [project.dependencies], test/lint deps
        # in the dev dependency group). requirements*.txt no longer exist.
        key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('apps/scraper/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ inputs.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      shell: bash
      working-directory: apps/scraper
      env:
        INSTALL_DEV: ${{ inputs.install-dev }}
      run: |
        # pip >= 25.1 is required for the PEP 735 dependency-group install
        # (pip install --group); the upgrade below guarantees it.
        python -m pip install --upgrade pip
        pip install -e .
        if [ "$INSTALL_DEV" = "true" ]; then
          pip install --group dev
        fi
