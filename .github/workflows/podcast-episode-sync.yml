name: Podcast Episode Sync

on:
  schedule:
    # Daily at 05:20 UTC (01:20 ET / 21:20 PT) keeps feeds fresh without
    # polling RSS hosts more aggressively than typical podcast publish rates.
    - cron: '20 5 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13-${{ hashFiles('apps/scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Sync podcast episodes from RSS
        id: rss_sync
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          # The driver orders by last_synced_at ASC NULLS FIRST. A bounded
          # batch keeps the scheduled workflow inside its timeout while still
          # rotating through the full feed set across repeated runs.
          python -m scripts.core.sync_podcast_episodes_from_rss --confirm --limit 500

      - name: Detect podcast episode appearances
        id: detect_appearances
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          # The detector orders episodes least-recently-scanned first (never
          # scanned first) and bumps each scanned episode's appearances_detected_at.
          # A bounded batch keeps the load query inside Neon's statement_timeout
          # (30s, set on the detector connection in connection.py) while still
          # rotating through the full episode backlog across runs.
          #
          # Limit sized empirically (TASK-2528): the binding cost is client-side
          # row transfer of the wide description/source_payload columns, not
          # server execution. Measured fetch time for the eligible backlog
          # (~162k episodes from accepted-comedian podcasts): 2k->3.7s, 10k->5.6s,
          # 25k->27s, 50k->28s, 100k+ -> QueryCanceled (>30s). 10k keeps a ~5x
          # safety margin under the 30s timeout while draining the backlog in
          # ~16 nights (vs ~81 at 2k). Never-scanned episodes sort first, so
          # steady-state new episodes are always covered.
          python -m scripts.core.detect_podcast_episode_appearances --episode-limit 10000

      - name: Upload podcast sync logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: podcast-episode-sync-logs-${{ github.run_id }}
          path: apps/scraper/logs/
          retention-days: 30

      - name: Record pipeline run
        if: always()
        continue-on-error: true
        env:
          GITHUB_JOB_STATUS: ${{ job.status }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python -m scripts.core.record_pipeline_run --status "$GITHUB_JOB_STATUS"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi

          FAILED_STEPS=()
          [[ "${{ steps.rss_sync.outcome }}" == "failure" ]] && FAILED_STEPS+=("RSS episode sync")
          [[ "${{ steps.detect_appearances.outcome }}" == "failure" ]] && FAILED_STEPS+=("Episode appearance detector")

          if [ ${#FAILED_STEPS[@]} -eq 0 ]; then
            FAILED_STEPS+=("Podcast episode sync workflow")
          fi

          FAILED_LIST=$(IFS=", "; echo "${FAILED_STEPS[*]}")
          MSG="[podcast-episode-sync] Failed: ${FAILED_LIST}. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"
