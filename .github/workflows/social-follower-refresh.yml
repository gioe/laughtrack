name: Social Follower Refresh

on:
  schedule:
    # Daily at 08:00 UTC (04:00 ET / 00:00 PT). Both platforms self-gate on
    # *_followers_refreshed_at (default 7-day staleness), so each account is
    # still only refreshed ~weekly — the daily cadence exists so the Instagram
    # step can chip away at its ~1,900-account cohort in timeout-sized daily
    # slices (--limit) rather than one ~5-hour run that would blow the job
    # timeout. Oldest-first ordering rotates the whole roster over a few days.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Refresh YouTube follower counts
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m scripts.core.refresh_social_followers --platform youtube

      - name: Refresh Instagram follower counts
        # Runs even if YouTube fails — the two platforms are independent.
        # Routes through the Decodo residential proxy (Instagram blocks CI
        # datacenter IPs directly) and self-gates on instagram_followers_refreshed_at.
        # --limit caps the run at a timeout-sized daily slice (~600 accounts ≈
        # 90 min at the observed ~9s/account through the proxy, inside the
        # 120-min job timeout). Progress is persisted in chunks, so even if the
        # slice overruns, whatever completed is saved and tomorrow's oldest-first
        # run resumes on the remainder.
        if: always()
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          INSTAGRAM_APP_ID: ${{ secrets.INSTAGRAM_APP_ID }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m scripts.core.refresh_social_followers --platform instagram --limit 600

      - name: Update comedian popularity scores
        if: success()
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python -m scripts.core.update_popularity --comedians

      - name: Upload logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: social-follower-refresh-logs-${{ github.run_id }}
          path: apps/scraper/logs/
          retention-days: 30

      - name: Record pipeline run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          job-status: ${{ job.status }}
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Social follower refresh failed. Check the logs artifact for details."
          echo "GitHub will send an email notification to repository administrators."
