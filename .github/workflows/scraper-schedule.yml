name: Scraper pipeline run

on:
  schedule:
    # Daily at 21:00 UTC (16:00 EST / 17:00 EDT)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run notification candidate selection without sending or recording notifications"
        type: boolean
        default: false

# Queue manual and scheduled runs so two partition matrices never overlap.
concurrency:
  group: scraper-pipeline
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Apply pending scraper migrations
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: python bin/migrate

  scrape_partition:
    name: Scrape partition ${{ matrix.partition_number }} of 3
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      # Let the other partition finish and retain its result if one child fails.
      # GitHub's "rerun failed jobs" then resumes only the failed child.
      fail-fast: false
      matrix:
        include:
          - partition_index: 0
            partition_number: 1
          - partition_index: 1
            partition_number: 2
          - partition_index: 2
            partition_number: 3
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run scraper partition
        id: run_scraper
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_USE_TLS: ${{ secrets.EMAIL_SMTP_USE_TLS }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
          SEATENGINE_AUTH_TOKEN: ${{ secrets.SEATENGINE_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          # Three runners at six workers add headroom while keeping per-runner pressure bounded.
          MAX_CONCURRENT_CLUBS: "6"
        run: |
          python -m scripts.core.scrape_shows --all \
            --partition-index "${{ matrix.partition_index }}" \
            --partition-count 3 \
            --skip-production-companies

      - name: Upload partition logs
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: scraper-logs-${{ github.run_id }}-partition-${{ matrix.partition_index }}
          path: apps/scraper/logs/
          retention-days: 30

      - name: Upload partition metrics
        uses: actions/upload-artifact@v7
        if: steps.run_scraper.outcome == 'success'
        with:
          name: scraper-metrics-${{ github.run_id }}-partition-${{ matrix.partition_index }}
          path: |
            apps/scraper/dashboard.html
            apps/scraper/metrics/
          if-no-files-found: error
          retention-days: 30

      - name: Record partition run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          pipeline-key: github_actions_scraper_pipeline_partition_${{ matrix.partition_index }}_of_3
          job-status: ${{ job.status }}
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}

  scrape_production_companies:
    name: Scrape production-company feeds
    needs: scrape_partition
    if: needs.scrape_partition.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run production-company scrapers
        id: run_scraper
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_USE_TLS: ${{ secrets.EMAIL_SMTP_USE_TLS }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
          SEATENGINE_AUTH_TOKEN: ${{ secrets.SEATENGINE_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
          MAX_CONCURRENT_CLUBS: "6"
        run: python -m scripts.core.scrape_shows --production-companies-only

      - name: Upload production-company logs
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: scraper-logs-${{ github.run_id }}-production-companies
          path: apps/scraper/logs/
          retention-days: 30

      - name: Upload production-company metrics
        uses: actions/upload-artifact@v7
        if: steps.run_scraper.outcome == 'success'
        with:
          name: scraper-metrics-${{ github.run_id }}-production-companies
          path: |
            apps/scraper/dashboard.html
            apps/scraper/metrics/
          if-no-files-found: error
          retention-days: 30

      - name: Record production-company phase
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          pipeline-key: github_actions_scraper_pipeline_production_companies
          job-status: ${{ job.status }}
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}

  finalize:
    name: Finalize completed scraper partitions
    needs: [scrape_partition, scrape_production_companies]
    if: >-
      needs.scrape_partition.result == 'success' &&
      needs.scrape_production_companies.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Download completed partition metrics
        uses: actions/download-artifact@v8
        with:
          pattern: scraper-metrics-${{ github.run_id }}-*
          path: apps/scraper/partition-metrics
          merge-multiple: false

      - name: Publish full scraper metrics snapshot
        id: merge_metrics
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_USE_TLS: ${{ secrets.EMAIL_SMTP_USE_TLS }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
        run: |
          python -m scripts.core.scrape_shows \
            --merge-partition-metrics partition-metrics \
            --expected-partitions 4

      - name: Revalidate home page cache
        if: always() && steps.merge_metrics.outcome == 'success'
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_SECRET is not configured"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 3 --max-time 15 \
            -X POST https://laugh-track.com/api/revalidate \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -d '{"tags": ["home-page-data"]}'

      - name: Update popularity scores (comedians, shows, clubs)
        if: always() && steps.merge_metrics.outcome == 'success'
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scripts.core.update_popularity

      - name: Backfill club description
        id: enrichment
        if: always() && steps.merge_metrics.outcome == 'success'
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python -m scripts.core.update_club_enrichment \
            --summary-out enrichment-summary.json

      - name: Backfill club timezones
        if: always() && steps.merge_metrics.outcome == 'success'
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: python -m scripts.core.backfill_club_timezones

      - name: Post enrichment summary to Discord
        if: always() && steps.merge_metrics.outcome == 'success'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping"
            exit 0
          fi
          if [ ! -s enrichment-summary.json ]; then
            echo "No enrichment summary file — skipping"
            exit 0
          fi
          SUMMARY=$(cat enrichment-summary.json)
          if ! echo "$SUMMARY" | jq empty >/dev/null 2>&1; then
            echo "Enrichment summary not valid JSON — skipping"
            exit 0
          fi
          FETCHED=$(echo "$SUMMARY" | jq -r '.fetched // 0')
          WRITTEN=$(echo "$SUMMARY" | jq -r '.written // 0')
          DESC=$(echo "$SUMMARY" | jq -r '.description_hits // 0')
          BOT_BLOCKED=$(echo "$SUMMARY" | jq -r '.bot_blocked // 0')
          MSG="[enrichment] fetched ${FETCHED}, wrote ${WRITTEN} (desc=${DESC}, bot_blocked=${BOT_BLOCKED})"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"

      - name: Send comedian arrival notifications
        if: always() && steps.merge_metrics.outcome == 'success'
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_USE_TLS: ${{ secrets.EMAIL_SMTP_USE_TLS }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APNS_BUNDLE_ID: ${{ secrets.APNS_BUNDLE_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python -m laughtrack.app.cli notify-comedian-arrivals --radius 50 $DRY_RUN_FLAG

      - name: Upload full scraper dashboard and metrics
        uses: actions/upload-artifact@v7
        if: always() && steps.merge_metrics.outcome == 'success'
        with:
          name: scraper-dashboard-${{ github.run_id }}
          path: |
            apps/scraper/dashboard.html
            apps/scraper/metrics/
          retention-days: 30

      - name: Record full pipeline run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          job-status: ${{ job.status }}
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}

  record_failure:
    name: Record scraper pipeline failure
    needs: [scrape_partition, scrape_production_companies, finalize]
    if: >-
      always() &&
      (needs.scrape_partition.result != 'success' ||
      needs.scrape_production_companies.result != 'success' ||
      needs.finalize.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Notify on failure
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Scraper production run failed. Check partition logs for details."
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            exit 0
          fi
          MSG="🚨 [scraper] Production pipeline run FAILED — ${RUN_URL}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')" \
            || echo "Discord post failed (non-fatal)"

      - name: Checkout code
        uses: actions/checkout@v5
        continue-on-error: true

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup
        continue-on-error: true

      - name: Record failed pipeline run
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          job-status: failure
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}
