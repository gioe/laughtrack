name: Scraper pipeline run

on:
  schedule:
    # Daily at 06:00 UTC (02:00 ET / 22:00 PT)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      # Apply any committed-but-unapplied apps/scraper/migrations/*.sql before the
      # scrape so the prod migrations_log can never silently drift behind the repo
      # (TASK-2935). bin/migrate is idempotent, serializes via a pg advisory lock,
      # and exits non-zero on failure so a bad migration fails the run loudly
      # instead of letting the scrape proceed against an un-migrated schema.
      # Migrations must stay idempotent (INSERT ... WHERE NOT EXISTS, guarded
      # UPDATEs) per convention #186 — they re-run here on every nightly invocation.
      - name: Apply pending scraper migrations
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python bin/migrate

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Playwright browsers
        run: |
          playwright install chromium --with-deps

      - name: Run scraper
        id: run_scraper
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_USE_TLS: ${{ secrets.EMAIL_SMTP_USE_TLS }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          ALERT_RECIPIENTS: ${{ secrets.ALERT_RECIPIENTS }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_PRIVATE_TOKEN: ${{ secrets.EVENTBRITE_PRIVATE_TOKEN }}
          SEATENGINE_AUTH_TOKEN: ${{ secrets.SEATENGINE_AUTH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Residential proxy egress for scrapers with use_residential_proxy=true
          # in the scrapers table. Unset secret = direct egress for everyone
          # (the registry returns the URL as None, ScraperProxyRegistry never
          # blocks the run on a missing secret).
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          # capsolver key for DataDome/AWS-WAF interactive CAPTCHA solves in
          # the Playwright fallback. Unset secret = solver disabled, no run
          # failure (build_default_solver returns None and the solve path is
          # skipped). DataDome solves additionally require a proxy, so only
          # proxy-enabled scrapers (tixr) can complete one — proxyless callers
          # skip the solve up front.
          CAPSOLVER_API_KEY: ${{ secrets.CAPSOLVER_API_KEY }}
        run: |
          python -m scripts.core.scrape_shows --all

      - name: Revalidate home page cache
        if: steps.run_scraper.outcome == 'success'
        continue-on-error: true
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          curl -fsS --retry 3 --max-time 15 \
            -X POST https://laugh-track.com/api/revalidate \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            -d '{"tags": ["home-page-data"]}'

      - name: Update popularity scores (comedians, shows, clubs)
        if: always()
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # With no flags the script updates comedians → shows → clubs in the
          # correct dependency order (shows and clubs both aggregate comedian
          # popularity via lineups) in a single process.
          python -m scripts.core.update_popularity

      - name: Backfill club description
        id: enrichment
        if: always()
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          # Fills description for any visible club still missing one (sourced
          # from the club's website LD-JSON / meta tags).  Only re-fetches
          # clubs that need an update, so nightly re-runs are cheap once the
          # backfill stabilises.
          #
          # --summary-out writes the JSON summary to a dedicated file so the
          # next step can parse it directly — decoupling the Discord post
          # from stdout so future Logger lines written after the print can't
          # silently break JSON parsing (previous tee + tail -n1 approach).
          python -m scripts.core.update_club_enrichment \
            --summary-out enrichment-summary.json

      - name: Backfill club timezones
        if: always()
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          # Fills timezone for any visible club still missing one, resolving
          # from clubs.state then clubs.address. No --geocode flag, so this is
          # a cheap state/address-only sweep that never touches the Places API
          # quota — it catches new NULL-tz clubs from every creation path
          # (Eventbrite organizer mode, national sweeps, discovery upserts).
          # Re-running is safe: every write is NULL-guarded.
          python -m scripts.core.backfill_club_timezones

      - name: Post enrichment summary to Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping"
            exit 0
          fi
          if [ ! -s enrichment-summary.json ]; then
            echo "No enrichment summary file (step failed before writing) — skipping"
            exit 0
          fi
          SUMMARY=$(cat enrichment-summary.json)
          if ! echo "$SUMMARY" | jq empty >/dev/null 2>&1; then
            echo "Enrichment summary not valid JSON — skipping Discord post"
            echo "File contents: $SUMMARY"
            exit 0
          fi
          FETCHED=$(echo "$SUMMARY" | jq -r '.fetched // 0')
          WRITTEN=$(echo "$SUMMARY" | jq -r '.written // 0')
          DESC=$(echo "$SUMMARY" | jq -r '.description_hits // 0')
          BOT_BLOCKED=$(echo "$SUMMARY" | jq -r '.bot_blocked // 0')
          MSG="[enrichment] fetched ${FETCHED}, wrote ${WRITTEN} (desc=${DESC}, bot_blocked=${BOT_BLOCKED})"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"

      - name: Send comedian arrival notifications
        if: always()
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SMTP_USE_TLS: ${{ secrets.EMAIL_SMTP_USE_TLS }}
          EMAIL_FROM_EMAIL: ${{ secrets.EMAIL_FROM_EMAIL }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
        run: |
          python -m laughtrack.app.cli notify-comedian-arrivals --radius 50 --days-ahead 30

      - name: Upload scraper logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scraper-logs-${{ github.run_id }}
          path: apps/scraper/logs/
          retention-days: 30

      - name: Upload scraper dashboard and metrics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: scraper-dashboard-${{ github.run_id }}
          path: |
            apps/scraper/dashboard.html
            apps/scraper/metrics/
          retention-days: 30

      - name: Record pipeline run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          job-status: ${{ job.status }}
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Scraper production run failed. Check the logs artifact for details."
          echo "GitHub will send an email notification to repository administrators."
