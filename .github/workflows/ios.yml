name: iOS

# Consolidated from five iOS workflow files in TASK-2634:
#   ios-build.yml, ios-pbxproj-sync.yml, ios-libs-pin-sync.yml,
#   ios-openapi-drift.yml, ios-bundle-version.yml.
# The five original workflow names appear as job display `name:` values below
# so branch-protection rules referencing them can be re-pointed to
# "iOS / <job name>" without ambiguity.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/app/api/v1/**/*.ts"
      - "ios/Sources/**"
      - "ios/Tests/**"
      - "ios/LaughTrack.xcodeproj/project.pbxproj"
      - "ios/LaughTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - "ios/Package.resolved"
      - "ios/project.yml"
      - "ios/bin/check-pbxproj-sync.sh"
      - "ios/bin/check-ios-libs-pin.sh"
      - "ios/bin/check-openapi-regen-drift.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/app/api/v1/**/*.ts"
      - "ios/Sources/**"
      - "ios/Tests/**"
      - "ios/LaughTrack.xcodeproj/project.pbxproj"
      - "ios/LaughTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - "ios/Package.resolved"
      - "ios/project.yml"
      - "ios/bin/check-pbxproj-sync.sh"
      - "ios/bin/check-ios-libs-pin.sh"
      - "ios/bin/check-openapi-regen-drift.sh"
      - "ios/bin/check-bundle-version.sh"
      - ".github/workflows/ios.yml"

jobs:
  # Per-job path gating: the workflow triggers on a union of all five original
  # path sets, then this filter decides which sub-area actually changed so each
  # gate only spins up its runner when relevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      pbxproj: ${{ steps.filter.outputs.pbxproj }}
      libs_pin: ${{ steps.filter.outputs.libs_pin }}
      openapi: ${{ steps.filter.outputs.openapi }}
      bundle_version: ${{ steps.filter.outputs.bundle_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Compute changed iOS sub-areas
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - 'apps/web/app/api/v1/**/*.ts'
              - 'ios/Sources/LaughTrackAPIClient/openapi.json'
              - 'ios/Sources/LaughTrackAPIClient/GeneratedSources/Types.swift'
              - 'ios/Sources/**'
              - 'ios/Tests/**'
              - '.github/workflows/ios.yml'
            pbxproj:
              - 'ios/Sources/**/*.swift'
              - 'ios/Tests/**/*.swift'
              - 'ios/LaughTrack.xcodeproj/project.pbxproj'
              - 'ios/Sources/LaughTrackApp/Info.plist'
              - 'ios/project.yml'
              - 'ios/bin/check-pbxproj-sync.sh'
              - '.github/workflows/ios.yml'
            libs_pin:
              - 'ios/project.yml'
              - 'ios/Package.resolved'
              - 'ios/LaughTrack.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved'
              - 'ios/bin/check-ios-libs-pin.sh'
              - '.github/workflows/ios.yml'
            openapi:
              - 'ios/Sources/LaughTrackAPIClient/openapi.json'
              - 'ios/Sources/LaughTrackAPIClient/openapi-generator-config.yaml'
              - 'ios/Sources/LaughTrackAPIClient/GeneratedSources/**'
              - 'ios/bin/check-openapi-regen-drift.sh'
              - '.github/workflows/ios.yml'
            bundle_version:
              - 'ios/project.yml'
              - 'ios/Sources/LaughTrackApp/Info.plist'
              - 'ios/bin/check-bundle-version.sh'
              - '.github/workflows/ios.yml'

  swift-build-tests:
    name: "iOS swift build --build-tests"
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile-gate LaughTrackTests against the current API surface
        run: cd ios && swift build --build-tests

  # Sim-test job pinned to an iOS 18.x runtime (TASK-2339). The iOS 26.1 / 26.2
  # SDK has a regression in _UIHostingView's accessibility-tree wiring that
  # fails ~18 tests across 16 HostedView suites on those runtimes; bisect
  # details and workaround patterns live in ios/CLAUDE.md under "iOS 26
  # Accessibility-Tree Wiring Regression (TASK-1921)". Pin the blocking CI test
  # job to iOS 18.x until Apple ships a fix. The exact version (currently 18.6)
  # is set by TEST_IOS_VERSION in ios/fastlane/Fastfile — keep it matched to a
  # runtime the runner image actually ships (the "Show available iOS simulator
  # runtimes" step below prints what's installed).
  sim-tests-ios-18:
    runs-on: macos-latest
    needs: [changes, swift-build-tests]
    if: needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show available iOS simulator runtimes
        run: xcrun simctl list runtimes

      - name: Install fastlane dependencies
        run: cd ios && bundle install

      - name: Run tests on the pinned iOS 18.x simulator
        run: cd ios && bundle exec fastlane test
        # `xcodebuild -showBuildSettings` intermittently exceeds fastlane's
        # default 3s base timeout / 4 retries on the macOS runner, failing the
        # job before tests even start. Give it more headroom.
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "30"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"

  # Non-blocking watcher (TASK-2339). Runs the same suite on the latest iOS
  # 26.x simulator so a future Apple fix surfaces in the CI signal — until
  # then this job is expected to fail and must stay non-blocking.
  sim-tests-ios-26-watch:
    runs-on: macos-latest
    needs: [changes, swift-build-tests]
    if: needs.changes.outputs.build == 'true'
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install fastlane dependencies
        run: cd ios && bundle install

      - name: Run tests on the iOS 26.x simulator (watcher)
        run: cd ios && bundle exec fastlane test_ios26_watch

  check-pbxproj:
    name: "iOS Xcode project sync guard"
    needs: changes
    if: needs.changes.outputs.pbxproj == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install XcodeGen
        run: |
          git clone --branch 2.45.4 --depth 1 https://github.com/yonaskolb/XcodeGen.git /tmp/XcodeGen
          swift build -c release --package-path /tmp/XcodeGen
          sudo install -m 0755 /tmp/XcodeGen/.build/release/xcodegen /usr/local/bin/xcodegen
          sudo mkdir -p /usr/local/share/xcodegen
          sudo cp -R /tmp/XcodeGen/.build/release/XcodeGen_XcodeGenKit.resources/SettingPresets /usr/local/share/xcodegen/

      - name: Verify every ios/Sources/**/*.swift and ios/Tests/**/*.swift is wired into project.pbxproj
        run: ios/bin/check-pbxproj-sync.sh

      # Scoped to push/schedule on main so failing PR checks don't spam Discord.
      - name: Notify Discord on failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi
          MSG="[ios-pbxproj-sync] Failed on main. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"

  check-ios-libs-pin:
    name: "iOS ios-libs pin sync"
    needs: changes
    if: needs.changes.outputs.libs_pin == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ios-libs revision matches across project.yml and both Package.resolved files
        run: ios/bin/check-ios-libs-pin.sh

  # Catch the TASK-2549 incident pattern: openapi.json edited without a matching
  # regen of GeneratedSources/Client.swift and Types.swift, stranding the iOS
  # client behind the server contract. Path-scoped so the cycle stays fast — the
  # macOS regen pulls swift-openapi-generator deps, so only run when an APIClient
  # file (or this workflow's wiring) actually changes.
  #
  # Blocking gate: the committed Client.swift / Types.swift were re-baselined
  # against the pinned generator (swift-openapi-generator 1.9.0) in TASK-2568,
  # so a clean regen now matches byte-for-byte. Any drift here means openapi.json
  # was edited without a matching client regen (TASK-2549 incident pattern) or
  # GeneratedSources/ was hand-edited — fix per ios/CLAUDE.md "OpenAPI Client
  # Regeneration".
  check-openapi-regen-drift:
    name: "iOS OpenAPI regen drift"
    needs: changes
    if: needs.changes.outputs.openapi == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Regenerate LaughTrackAPIClient into a temp directory and diff
        run: ios/bin/check-openapi-regen-drift.sh

  check-bundle-version:
    name: "iOS bundle version guard"
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.bundle_version == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need full history (or at least the merge base) so the script can read
          # ios/project.yml at the base ref via `git show`.
          fetch-depth: 0

      - name: Verify CURRENT_PROJECT_VERSION has not decreased vs base branch
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: ios/bin/check-bundle-version.sh
