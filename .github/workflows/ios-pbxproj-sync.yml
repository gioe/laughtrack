name: iOS Xcode project sync guard

on:
  push:
    branches: [main]
    paths:
      - "ios/Sources/**/*.swift"
      - "ios/Tests/**/*.swift"
      - "ios/LaughTrack.xcodeproj/project.pbxproj"
      - "ios/Sources/LaughTrackApp/Info.plist"
      - "ios/project.yml"
      - "ios/bin/check-pbxproj-sync.sh"
      - ".github/workflows/ios-pbxproj-sync.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/Sources/**/*.swift"
      - "ios/Tests/**/*.swift"
      - "ios/LaughTrack.xcodeproj/project.pbxproj"
      - "ios/Sources/LaughTrackApp/Info.plist"
      - "ios/project.yml"
      - "ios/bin/check-pbxproj-sync.sh"
      - ".github/workflows/ios-pbxproj-sync.yml"

jobs:
  check-pbxproj:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Install XcodeGen
        run: |
          git clone --branch 2.45.4 --depth 1 https://github.com/yonaskolb/XcodeGen.git /tmp/XcodeGen
          swift build -c release --package-path /tmp/XcodeGen
          sudo install -m 0755 /tmp/XcodeGen/.build/release/xcodegen /usr/local/bin/xcodegen
          sudo mkdir -p /usr/local/share/xcodegen
          sudo cp -R /tmp/XcodeGen/.build/release/XcodeGen_XcodeGenKit.resources/SettingPresets /usr/local/share/xcodegen/

      - name: Verify every ios/Sources/**/*.swift and ios/Tests/**/*.swift is wired into project.pbxproj
        run: ios/bin/check-pbxproj-sync.sh

      # Scoped to push/schedule on main so failing PR checks don't spam Discord.
      - name: Notify Discord on failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi
          MSG="[ios-pbxproj-sync] Failed on main. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"
