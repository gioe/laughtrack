name: Web CI/CD

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "apps/web/**"
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Run e2e-visual with --update-snapshots and upload regenerated Linux baselines as an artifact (commit them manually to approve)."
        type: boolean
        default: false

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Only runs when E2E_BASE_URL is set as a GitHub Actions repo/environment variable
    if: ${{ vars.E2E_BASE_URL != '' }}
    needs: [type-check, lint, test]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL }}

  e2e-visual:
    name: E2E Visual Regression
    runs-on: ubuntu-latest
    needs: [type-check, lint, test]
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Required secrets for this job:
      #   DATABASE_URL  — used by `next build` for sitemap.xml prerender and Prisma
      #   DIRECT_URL    — Prisma migrate deploy (same value as DATABASE_URL is fine)
      #   AUTH_SECRET   — NextAuth v5 session signing; a throwaway value is acceptable
      #                   because fixture mode bypasses auth(), but it must exist for
      #                   the build to succeed.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          BUNNYCDN_CDN_HOST: laughtrack.b-cdn.net

      - name: Start Next.js in fixture mode
        run: |
          E2E_FIXTURE_MODE=1 \
          DATABASE_URL='${{ secrets.DATABASE_URL }}' \
          DIRECT_URL='${{ secrets.DIRECT_URL }}' \
          AUTH_SECRET='${{ secrets.AUTH_SECRET }}' \
          BUNNYCDN_CDN_HOST=laughtrack.b-cdn.net \
          PORT=3100 \
          npm start > /tmp/visual-server.log 2>&1 &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in {1..60}; do
            if curl -sf -o /dev/null http://localhost:3100; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 60s"
          tail -50 /tmp/visual-server.log
          exit 1

      - name: Run visual regression
        run: |
          if [ "${{ inputs.update_baselines }}" = "true" ]; then
            BASE_URL=http://localhost:3100 npm run test:e2e:visual:update
          else
            BASE_URL=http://localhost:3100 npm run test:e2e:visual
          fi

      - name: Stop server
        if: always()
        run: kill ${SERVER_PID:-0} 2>/dev/null || true

      # When update_baselines=true: uploads the regenerated Linux baselines so
      # a maintainer can download + commit them. On regular runs: uploads diffs
      # on failure so maintainers can review what changed. Playwright writes
      # actual/diff/expected PNGs + trace.zip under test-results/ and the full
      # HTML report under playwright-report/.
      - name: Upload baselines (update mode)
        if: ${{ inputs.update_baselines == true }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-baselines
          path: apps/web/e2e/home-carousels.spec.ts-snapshots/
          retention-days: 14

      - name: Upload diff artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-diff
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/e2e/home-carousels.spec.ts-snapshots/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Required GitHub Actions secrets for this step:
      #   DATABASE_URL  — Neon serverless connection string (runtime + Prisma client)
      #   DIRECT_URL    — Direct Neon connection string (Prisma migrate deploy only)
      #   AUTH_SECRET   — NextAuth v5 session token signing secret (openssl rand -base64 32)
      # See apps/web/.env.example for variable descriptions and provisioning guidance.
      # BUNNYCDN_CDN_HOST is the public Bunny CDN pull-zone hostname (not a secret —
      # also hardcoded in next.config.mjs and middleware.ts CSP). next build needs
      # it because apps/web/util/imageUtil.ts throws at module load if unset.
      - name: Build
        run: npm run build
        env:
          BUNNYCDN_CDN_HOST: laughtrack.b-cdn.net

  migrations:
    name: Prisma Migrations
    runs-on: ubuntu-latest
    # Validate pending migrations against an ephemeral COPY of prod (a Neon
    # copy-on-write branch), so a migration's backfill / new constraint runs
    # against the REAL current schema + data. This is the only faithful way to
    # catch the class that broke prod in TASK-3462: the club_aliases backfill
    # hit duplicate onboarding-seeded alias rows (P3009 / 23505 unique
    # violation), which a from-empty replay can't reproduce (this repo's
    # migration history is baselined and not replayable from scratch — see
    # apps/web/DEPLOYMENT.md) and an empty-schema check would never surface.
    # A failed migration is transactional and, once it fails on prod, blocks
    # ALL future `prisma migrate deploy` until manually recovered, so catching
    # it here is high value. See convention #237.
    #
    # Gated on the NEON_PROJECT_ID repo variable so the job is skipped (not
    # failed) until the Neon API credentials are provisioned — same pattern as
    # the e2e job's E2E_BASE_URL gate. Required to activate (see DEPLOYMENT.md):
    #   secret NEON_API_KEY        — Neon API key with branch create/delete
    #   var    NEON_PROJECT_ID     — Neon project id
    #   var    NEON_PARENT_BRANCH  — prod branch to copy (e.g. "production"/"main")
    #   var    NEON_DB_NAME        — database name (e.g. "neondb")
    #   var    NEON_DB_ROLE        — role to connect as
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Instant copy-on-write branch of prod. The branch starts as a full copy
      # of prod's schema + data, so `migrate deploy` below applies only the
      # not-yet-applied (PR) migrations against real rows.
      - name: Create ephemeral Neon branch from prod
        id: neon
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent: ${{ vars.NEON_PARENT_BRANCH }}
          branch_name: ci-migrations-${{ github.run_id }}-${{ github.run_attempt }}
          database: ${{ vars.NEON_DB_NAME }}
          username: ${{ vars.NEON_DB_ROLE }}
          api_key: ${{ secrets.NEON_API_KEY }}

      # Applies pending migrations against the prod copy. Fails the build on any
      # migration error (DDL, backfill collision, constraint violation) BEFORE
      # the migration can reach prod via the Vercel deploy.
      - name: Apply pending migrations to the prod copy
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
          DIRECT_URL: ${{ steps.neon.outputs.db_url }}
        run: npx prisma migrate deploy

      # Always tear down the ephemeral branch, even if migrate deploy failed.
      - name: Delete ephemeral Neon branch
        if: always() && steps.neon.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_id: ${{ steps.neon.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

  notify-failure:
    name: Notify Discord on failure
    runs-on: ubuntu-latest
    needs: [type-check, lint, test, e2e, e2e-visual, build, migrations]
    # failure() runs this job when any needed job failed; scoped to push/schedule
    # on main so failing PR checks don't spam Discord.
    if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    steps:
      - name: Post failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi
          MSG="[web-ci] Failed on main. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"
