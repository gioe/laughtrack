name: Provision Grafana Alert Rules

# Grafana Cloud has no file-based alert provisioning, so this workflow
# reconciles apps/web/monitoring/grafana/scraper-health-alerts.yaml into the
# aiqobservability stack via the Alerting provisioning HTTP API whenever the
# YAML (or the reconcile script) changes on main. Idempotent: a run with no
# drift writes nothing. See provision_alert_rules.py for what the YAML owns
# vs what is preserved from the live rules (uid, folder, contact-point
# binding). TASK-3580.

on:
  push:
    branches: [main]
    paths:
      - apps/web/monitoring/grafana/scraper-health-alerts.yaml
      - apps/web/monitoring/grafana/provision_alert_rules.py
      - .github/workflows/grafana-provision.yml
  # Monthly canary: run the reconcile in --dry-run so an expired
  # GRAFANA_ACCOUNT_TOKEN (a provisioning-API failure -> exit 1) surfaces on
  # Discord within a month, instead of staying silent until the next alert-YAML
  # edit push fails. Runs 08:00 UTC on the 1st. Dry-run never writes to Grafana.
  schedule:
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report drift without writing to Grafana
        type: boolean
        default: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Reconcile alert rules into Grafana Cloud
        env:
          GRAFANA_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_ACCOUNT_TOKEN }}
        run: |
          # Scheduled (canary) runs ALWAYS dry-run so they never write; a push
          # (real reconcile) writes; a manual dispatch honors its dry_run input.
          python apps/web/monitoring/grafana/provision_alert_rules.py \
            ${{ (github.event_name == 'schedule' || inputs.dry_run) && '--dry-run' || '' }}

      - name: Notify Discord on failure
        # Scoped to push (real reconcile) and schedule (token-rot canary) on main
        # so a failing manual dispatch or PR check doesn't spam Discord.
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi
          MSG="[grafana-provision] alert-rule reconcile failed on main (check GRAFANA_ACCOUNT_TOKEN). View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"
