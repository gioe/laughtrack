name: Discover Clubs from Comedian Show Pages

on:
  schedule:
    # Weekly on Sunday at 08:00 UTC.
    - cron: '0 8 * * 0'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Scrape comedian websites
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Invoke the module directly rather than `make`: the Makefile gates
          # on a local .venv/ (activate_venv) which CI lacks. Runs ahead of
          # discover step so widget_detector can stamp bandsintown_id onto
          # comedians first, feeding downstream discovery.
          python -m scripts.core.scrape_comedian_websites --all -v

      - name: Discover clubs from comedian show pages
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # Invoke the module directly rather than `make discover-clubs`:
          # the Makefile target gates on a local .venv/ (activate_venv), but CI
          # installs deps system-wide, so `make` bails with "No virtual
          # environment found" before running.
          python -m scripts.core.discover_clubs_from_comedian_show_pages --create-clubs -v

      - name: Upload logs
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: discover-clubs-logs-${{ github.run_id }}
          path: apps/scraper/logs/
          retention-days: 30

      - name: Record pipeline run
        if: always()
        continue-on-error: true
        uses: ./.github/actions/record-pipeline-run
        with:
          job-status: ${{ job.status }}
          database-name: ${{ secrets.DATABASE_NAME }}
          database-user: ${{ secrets.DATABASE_USER }}
          database-host: ${{ secrets.DATABASE_HOST }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          database-port: ${{ secrets.DATABASE_PORT }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Comedian show page club discovery failed. Check the logs artifact for details."
          echo "GitHub will send an email notification to repository administrators."
