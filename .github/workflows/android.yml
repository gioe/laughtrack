name: Android CI

# Path-gated: only runs when the Android client (or this workflow) changes, so
# iOS/web/scraper changes don't pay for an Android build. Mirrors ios.yml gating.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    name: Assemble + unit + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pins Gradle 8.11.1 and puts `gradle` on PATH + enables build caching.
      # Using the managed Gradle means CI does not depend on a committed
      # gradle-wrapper.jar (generate that locally with `gradle wrapper`).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Lint + static analysis
        run: gradle ktlintCheck detekt --no-daemon --stacktrace

  instrumented-tests:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    # Emulator jobs are slow/expensive; only run on PRs and pushes that already
    # passed the path gate. minSdk is 26; test on a representative API level.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      - name: Run connected (instrumented) tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: android
          script: gradle connectedDebugAndroidTest --no-daemon --stacktrace
