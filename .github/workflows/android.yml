name: Android CI

# Path-gated: only runs when the Android client (or this workflow) changes, so
# iOS/web/scraper changes don't pay for an Android build. Mirrors ios.yml gating.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      # The Kotlin client is generated from the shared spec; a spec-only edit
      # (e.g. from an iOS task) must still run the drift check.
      - "ios/Sources/LaughTrackAPIClient/openapi.json"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "ios/Sources/LaughTrackAPIClient/openapi.json"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  openapi-drift:
    name: OpenAPI client drift check
    runs-on: ubuntu-latest
    # Blocking gate: the committed Kotlin client must match a clean regen of the
    # shared openapi.json. Needs only a JDK (no Android SDK / Gradle), so it runs
    # fast. Mirrors the iOS check-openapi-regen-drift gate.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check generated client matches the spec
        working-directory: .
        run: ./android/bin/check-openapi-regen-drift.sh

  build-and-test:
    name: Assemble + unit + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Pins Gradle 8.11.1 and puts `gradle` on PATH + enables build caching.
      # Using the managed Gradle means CI does not depend on a committed
      # gradle-wrapper.jar (generate that locally with `gradle wrapper`).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble (debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Lint + static analysis
        run: gradle ktlintCheck detekt --no-daemon --stacktrace

  instrumented-tests:
    name: Instrumented tests (emulator)
    # The Linux hosted runner repeatedly lost the emulator process as the first
    # Compose app test rendered, across gfxstream's indirect, direct, and
    # compatibility software paths. Use the fixed Intel macOS image so x86_64
    # virtualization stays available without the unstable Linux graphics path.
    runs-on: macos-15-intel
    # Emulator jobs are slow/expensive; only run on PRs and pushes that already
    # passed the path gate. minSdk is 26; test on a representative API level.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run connected (instrumented) tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          # Keep the emulator inside the hosted runner's CPU/memory envelope.
          # The project Gradle heap/workers are also capped by the runner script.
          cores: 1
          ram-size: 2048M
          emulator-build: 15507667 # 36.6.11, the last version proven green here
          # Software rendering avoids the Linux gfxstream crash and the hosted
          # Mac's non-accelerated "host" renderer. A phone-sized viewport keeps
          # all screenshot actions visible without a high-density profile.
          emulator-options: -no-window -gpu software -skin 390x844 -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -no-metrics
          working-directory: android
          # Starting ADB first lets the emulator register immediately instead
          # of racing the action's first sys.boot_completed poll.
          pre-emulator-launch-script: adb start-server
          # Only modules that declare an AndroidJUnitRunner + androidTest sources
          # are targeted (currently :app with the Hilt-backed AppShellTest +
          # AppStoreScreenshotTest, :core:ui with RemoteImageFallbackTest, and
          # :feature:library with its deterministic interaction tests). A
          # project-wide `connectedDebugAndroidTest` falls back to
          # the legacy android.test.InstrumentationTestRunner in runner-less
          # modules, which ANRs at startup ("failed to complete startup") and
          # reports "Process crashed" — add modules here explicitly as they gain
          # instrumented suites. Separate invocations so each module's result is
          # attributable in the log even when the other is red.
          script: ./bin/run-instrumented-tests-ci

      # The emulator action can fail before its custom script starts (AVD
      # creation or boot timeout). Preserve the same host/device evidence on
      # that path; test failures also get a pre-cleanup snapshot from the
      # script's EXIT trap.
      - name: Capture emulator failure diagnostics
        if: failure()
        run: ./bin/run-instrumented-tests-ci --diagnostics-only

      - name: Upload emulator failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-diagnostics
          path: ${{ runner.temp }}/android-emulator-diagnostics
          if-no-files-found: warn
          retention-days: 14

  # Alert on Discord when any job fails on a push to main. Merges to main land
  # via direct fast-forward push, which bypasses required status checks, so these
  # jobs run POST-merge and their failure blocks nothing — without this, a red
  # main (e.g. the uncompilable Android client behind TASK-3287/3298) goes
  # unnoticed. One job that needs the others fires a single alert for any
  # failure; mirrors the scraper-ci.yml / ios.yml notify pattern.
  notify-failure:
    name: Notify Discord on failure
    needs: [openapi-drift, build-and-test, instrumented-tests]
    if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # The workflow-level default working-directory is `android`, which only
    # exists after a checkout; this job does no checkout, so reset it to the
    # always-present workspace root.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Post failure alert to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi
          MSG="[android-ci] Failed on main. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"
