name: Scraper CI

on:
  push:
    branches: [main]
    paths:
      - "apps/scraper/**"
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/scraper

    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup
        with:
          python-version: ${{ matrix.python-version }}
          install-dev: "true"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Run tests
        env:
          # Playwright binaries are not installed in CI; disable the Chromium fallback so tests stay fast and hermetic
          PLAYWRIGHT_FALLBACK: "0"
        run: |
          python -m pytest -v --tb=short --disable-warnings \
            --junitxml=pytest-results.xml \
            --cov=src/laughtrack \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            apps/scraper/pytest-results.xml
            apps/scraper/coverage.xml
          retention-days: 30

      # Scoped to push/schedule on main so failing PR checks don't spam Discord.
      - name: Notify Discord on failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping Discord failure alert"
            exit 0
          fi
          MSG="[scraper-ci] Failed on main. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsS --retry 3 --max-time 10 -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg c "$MSG" '{content: $c}')"
