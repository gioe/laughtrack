name: Comedian CDN image flag sync

on:
  schedule:
    # Weekly on Monday at 09:00 UTC (05:00 ET / 01:00 PT)
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/scraper

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up scraper Python environment
        uses: ./.github/actions/scraper-setup

      - name: Run CDN image audit
        env:
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python -m scripts.core.audit_comedian_images --update

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cdn-image-audit-logs-${{ github.run_id }}
          path: apps/scraper/logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Record pipeline run
        if: always()
        continue-on-error: true
        env:
          GITHUB_JOB_STATUS: ${{ job.status }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
        run: |
          python -m scripts.core.record_pipeline_run --status "$GITHUB_JOB_STATUS"

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::CDN image audit failed. Check the logs artifact for details."
          echo "GitHub will send an email notification to repository administrators."
