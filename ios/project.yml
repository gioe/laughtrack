name: LaughTrack
options:
  bundleIdPrefix: com.laughtrack
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.3"
packages:
  ios-libs:
    url: https://github.com/gioe/ios-libs.git
    revision: 1446ce261511113b68e1588626db8264100c62e0
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: "1.9.0"
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    from: "1.0.0"
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: "1.2.0"
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.13.0"
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  LaughTrackCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LaughTrackCore
    dependencies:
      - target: LaughTrackBridge
      - target: LaughTrackAPIClient
      - package: ios-libs
        product: SharedKit
      - package: ios-libs
        product: APIClient
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
      - package: sentry-cocoa
        product: Sentry
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laughtrack.core
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "2.1"
  LaughTrackBridge:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LaughTrackBridge
    dependencies:
      - package: ios-libs
        product: SharedKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laughtrack.bridge
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "2.1"
  LaughTrackAPIClient:
    type: framework
    platform: iOS
    sources:
      - path: Sources/LaughTrackAPIClient
        excludes:
          - openapi.json
          - openapi-generator-config.yaml
    dependencies:
      - package: ios-libs
        product: APIClient
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laughtrack.apiclient
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "2.1"
  LaughTrack:
    type: application
    platform: iOS
    sources:
      - path: Sources/LaughTrackApp
      - path: Resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Sources/LaughTrackApp/Info.plist
      properties:
        # Drive build/marketing version from project.yml build settings (CURRENT_PROJECT_VERSION /
        # MARKETING_VERSION). Without these explicit overrides xcodegen materializes the
        # build-setting values as literal strings into Info.plist on every regen, silently
        # downgrading whatever fastlane wrote (TASK-1902).
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        SentryDSN: "$(SENTRY_DSN)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.laughtrack.app.auth
            CFBundleURLSchemes:
              - laughtrack
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        NSLocationWhenInUseUsageDescription: LaughTrack uses your location to find nearby comedy shows and match it to a 5-digit ZIP code.
        NSCalendarsUsageDescription: LaughTrack adds comedy shows you choose to your calendar.
        NSCalendarsWriteOnlyAccessUsageDescription: LaughTrack adds comedy shows you choose to your calendar.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: LaughTrackCore
      - target: LaughTrackBridge
      - target: LaughTrackAPIClient
      - package: ios-libs
        product: SharedKit
      - package: ios-libs
        product: APIClient
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.laughtrack.ios
        DEVELOPMENT_TEAM: 4HDNC3V5Q6
        # PRODUCT_MODULE_NAME is intentionally LaughTrackApp (not the target name
        # LaughTrack) so `@testable import LaughTrackApp` works in both SPM
        # (where the target is named LaughTrackApp) and Xcode. Aligning the
        # Swift module name across both build systems lets the same test files
        # build under `swift test` and `xcodebuild test`.
        PRODUCT_MODULE_NAME: LaughTrackApp
        GENERATE_INFOPLIST_FILE: "NO"
        # Push Notifications capability. The entitlements file reads aps-environment
        # from $(APS_ENVIRONMENT), set per-config below. Without this the signed
        # binary lacks aps-environment and registerForRemoteNotifications() fails
        # on device (didFailToRegister fires; no token is ever delivered), even
        # though the provisioning profile grants it.
        CODE_SIGN_ENTITLEMENTS: Sources/LaughTrackApp/LaughTrack.entitlements
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "15"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        # iPhone-only (TARGETED_DEVICE_FAMILY "1"). Without this xcodegen defaults
        # to "1,2" (iPhone + iPad), which makes App Store Connect require iPad
        # screenshots before accepting a submission for review. The app has no
        # iPad-specific UI and just renders the iPhone layout scaled on iPad,
        # so we ship iPhone-only and iPad users still install via the iPhone
        # App Store with the standard scaled-iPhone-app treatment.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    scheme:
      testTargets:
        - LaughTrackTests
        - LaughTrackUITests
  LaughTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LaughTrackTests
        createIntermediateGroups: true
    dependencies:
      - target: LaughTrack
      - target: LaughTrackCore
      - target: LaughTrackBridge
      - target: LaughTrackAPIClient
      - package: ios-libs
        product: SharedKit
      - package: ios-libs
        product: APIClient
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laughtrack.tests
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "2.1"
  LaughTrackUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LaughTrackUITests
        createIntermediateGroups: true
      # Dual target membership for UITestLaunchArgs.swift (TASK-2614): the XCUITest
      # bundle runs in a separate process and cannot `import LaughTrackApp`, so the
      # shared launch-arg constants need to compile into both binaries. Declaring
      # the file here (in addition to the LaughTrack app target's Sources/LaughTrackApp
      # entry) lets xcodegen emit the second target-membership Sources entry on every
      # regen — without this, `fastlane bump_build_number`'s xcodegen step would
      # strip the hand-edited dual wiring on every TestFlight bump.
      - path: Sources/LaughTrackApp/UITestLaunchArgs.swift
    dependencies:
      - target: LaughTrack
      - package: ios-libs
        product: SharedKitTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.laughtrack.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "2.1"
        TEST_TARGET_NAME: LaughTrack
