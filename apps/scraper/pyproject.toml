[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laughtrack"
version = "0.1.0"
description = "A scraper for comedy events"
# gioe-libs (runtime dep) supports >=3.11; CI and the local venv run 3.13.
requires-python = ">=3.11"
dependencies = [
    # HTTP clients
    "aiohttp>=3.9.0",
    "requests>=2.33.1",
    "httpx[http2]>=0.28.0",  # HTTP/2 client for APNs push notification delivery
    "curl-cffi>=0.5.0",  # Chrome TLS/JA3 fingerprinting (utilities.infrastructure.paginator)
    "urllib3>=2.7.0",  # requests backend; floor pinned to patch decompression-bomb / redirect-header CVEs
    "asynciolimiter>=1.0.0",  # async rate limiting for HTTP requests
    "cryptography>=48.0.1",  # ES256 signing for APNs provider authentication tokens
    # Scraping & parsing
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",  # RSS/Atom parsing for podcast episode ingestion
    # Playwright JS fallback (lazy-loaded; only used when bot-block detected).
    # Pinned EXACTLY: the DataDome capsolver path pins _USER_AGENT in
    # playwright_browser.py to the bundled Chromium major (Chrome/145 for
    # 1.58.0). A floating playwright would let CI's bundled Chromium drift out
    # of capsolver's supported window (the Chrome/124 incident, TASK-2689).
    # When bumping, re-pin the UA constant in the same change. After
    # installing, run: playwright install chromium
    "playwright==1.58.0",
    # Data & persistence
    "psycopg2-binary>=2.9.5",
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "Pillow>=12.2.0",  # floor pinned to patch PSD OOB-write and FITS GZIP decompression-bomb CVEs
    # Time & location
    "pytz>=2023.3",
    "python-dateutil>=2.8.0",
    "pgeocode>=0.4.0",  # zip code -> lat/lon for notification distance filtering
    "numpy>=1.24.0",  # required by pgeocode
    "pandas>=2.0.0",  # required by pgeocode
    # Config & logging
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    # Google APIs (Gmail inbox client)
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    # Shared infrastructure utilities (alerting, rate limiting, HTML scraping).
    # uv.lock pins this to a specific commit; refresh with
    # `uv lock --upgrade-package gioe-libs` after python-libs pushes.
    "gioe-libs @ git+https://github.com/gioe/python-libs.git",
]

# PEP 735 dependency group. Plain `uv sync` installs it by default; CI installs
# it with `pip install --group dev` when the scraper-setup action gets
# install-dev: "true".
[dependency-groups]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.2.0",
    "coverage>=7.3.0",
    "time-machine>=2.13.0",  # frozen-clock fixture-rot sweep (FAKE_NOW in tests/conftest.py)
    "vcrpy>=4.3.0",  # record/replay HTTP interactions for schema-drift tests
    # Code quality
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "pre-commit>=3.4.0",
    "import-linter>=1.10.0",  # enforce layering and dependency contracts
    # Docs
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    # Dev tools & profiling
    "ipython>=8.15.0",
    "ipdb>=0.13.0",
    "rich>=13.5.0",
    "pyclean>=2.2.0",
    "memory-profiler>=0.61.0",
    "psutil>=5.9.0",
    "line-profiler>=4.1.0",
]
viz = [
    # Optional dashboards and analysis tools for make visualize-metrics.
    "streamlit>=1.45.1",
    "plotly>=6.1.1",
    "pandas>=2.2.3",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "jupyter>=1.0.0",
]

[tool.uv]
# Keep viz installs stable across a later plain `uv sync`; use
# `uv sync --no-group viz` when a dev-only environment is desired.
default-groups = ["dev", "viz"]

[tool.hatch.build.targets.wheel]
packages = ["src/laughtrack"]

# Required for the gioe-libs git direct reference in project.dependencies.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

# =============================================================================
# CODE QUALITY & LINTING CONFIGURATION
# =============================================================================

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
    # directories
    \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "scripts", "tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true

# Paths to check
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
ignore_errors = true

# Archived one-off scripts (completed backfills/dispositions) are kept for
# reference only — never re-run, never type-checked.
[[tool.mypy.overrides]]
module = [
    "scripts.archive.*",
]
ignore_errors = true

[tool.laughtrack_quality_baseline]
# Ratcheting CI gate for TASK-3666. Keep scripts excluded from the ratchet
# until the archived-script split is complete; unused-ignore is still checked
# across src/ and scripts/ by direct mypy runs.
flake8_paths = ["src"]
flake8_select = ["F821", "F811", "F401"]
flake8_max_errors = 73
mypy_paths = ["src"]
mypy_max_errors = 608

# =============================================================================
# ARCHITECTURE: IMPORT-LINTER CONTRACTS
# =============================================================================
[tool.importlinter]
root_package = "laughtrack"

## NOTE: A strict layered contract is intentionally omitted at this stage.
## We start with targeted forbidden rules to establish a safe baseline,
## and will tighten to layers after refactors.

[[tool.importlinter.contracts]]
name = "Ports do not depend on app/infra/scrapers/adapters"
type = "forbidden"
source_modules = ["laughtrack.ports"]
forbidden_modules = [
    "laughtrack.app",
    "laughtrack.infrastructure",
    "laughtrack.scrapers",
    "laughtrack.adapters",
]

[[tool.importlinter.contracts]]
name = "Scrapers cannot depend on app"
type = "forbidden"
source_modules = ["laughtrack.scrapers"]
forbidden_modules = ["laughtrack.app"]

## Restores the entity-layer purity guarantee lost when the laughtrack.domain
## facade (and its forbidden contract) was deleted in TASK-3646. Scoped to
## core.entities rather than all of laughtrack.core because core.services
## legitimately reaches infrastructure today (e.g. metrics.reporter ->
## infrastructure.email.service). core/entities/__init__.py exists so this
## source is a regular package — import-linter rejects implicit namespace
## packages as sources. base_handler reaches the DB through the
## ports.database seam (adapters.db self-registers at import — TASK-3701),
## so no ignore_imports grandfathering remains.
[[tool.importlinter.contracts]]
name = "Core entities do not depend on app/infra/scrapers/adapters"
type = "forbidden"
source_modules = ["laughtrack.core.entities"]
forbidden_modules = [
    "laughtrack.app",
    "laughtrack.infrastructure",
    "laughtrack.scrapers",
    "laughtrack.adapters",
]

## laughtrack.domain was a pure re-export facade over laughtrack.core, deleted
## in TASK-3646. Import laughtrack.core directly; do not reintroduce the facade.
## Sources enumerate every laughtrack subpackage (not the root) because
## import-linter rejects a contract whose forbidden module is a descendant of a
## source module once that module exists again. When adding a new top-level
## laughtrack subpackage, add it to this source list too.
[[tool.importlinter.contracts]]
name = "The deleted laughtrack.domain facade must not be reintroduced"
type = "forbidden"
source_modules = [
    "laughtrack.adapters",
    "laughtrack.app",
    "laughtrack.core",
    "laughtrack.foundation",
    "laughtrack.infrastructure",
    "laughtrack.ports",
    "laughtrack.scrapers",
    "laughtrack.shared",
    "laughtrack.utilities",
]
forbidden_modules = ["laughtrack.domain"]
