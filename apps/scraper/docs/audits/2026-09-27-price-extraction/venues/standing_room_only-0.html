<script>

    //Doc Ready
    $(function () {

        var element = document.getElementById("EventList");
        element.classList.remove("k-widget");

    });


    function ToggleMedia(id, videourl) {


        if (videourl == 'null') return;

        var evtimage = "#EventImage" + id;
        var evtvideo = "#EventVideo" + id;

        if ($(evtimage).is(':visible')) {

            $(evtimage).fadeOut(500, function () {
                $(evtvideo).fadeIn(500);
            });
        }
        else {

            $(evtimage).fadeOut(500, function () {
                $(evtvideo).fadeIn(500);
            });
        }
    }


    function onReturn(e) {

        $('#btnReturn').hide();
        $('#tabStrip').fadeOut('slow',
            function () {
                //jQuery('#tabStrip').html("Load up:" + e);

                jQuery('#EventsContainer').fadeIn('slow');


            });

    }


    function decodeEntities(encodedString) {
        var textArea = document.createElement('textarea');
        textArea.innerHTML = encodedString;
        return textArea.value;
    }


</script>

<style>



    time {
        margin-left: 10px !important;
    }

        time.addmargin {
            margin: 10px !important;
        }

        time.killmargin {
            margin: 0px !important;
        }

        time.icon {
            font-size: 1em; /* change icon size */
            display: block;
            position: relative;
            width: 7em;
            height: 7em;
            background-color: #fff;
            margin: 2em auto;
            border-radius: 0.6em;
            box-shadow: 0 1px 0 #bdbdbd, 0 2px 0 #fff, 0 3px 0 #bdbdbd, 0 4px 0 #fff, 0 5px 0 #bdbdbd, 0 0 0 1px #bdbdbd;
            overflow: hidden;
            -webkit-backface-visibility: hidden;
            -webkit-transform: rotate(0deg) skewY(0deg);
            -webkit-transform-origin: 50% 10%;
            transform-origin: 50% 10%;
            line-height: 1 !important;
        }

            time.icon * {
                display: block;
                width: 100%;
                font-size: 1em;
                font-weight: bold;
                font-style: normal;
                text-align: center;
            }

            time.icon strong {
                position: absolute;
                top: 0;
                padding: 0.4em 0;
                color: #fff;
                background-color: #1996e4;
                /*border-bottom: 1px solid #f37302;*/
                box-shadow: 0 2px 0 #1996e4;
            }

            time.icon em {
                position: absolute;
                bottom: 0.3em;
                color: #1996e4;
            }

            time.icon span {
                width: 100%;
                font-size: 2.8em;
                letter-spacing: -0.05em;
                padding-top: 0.7em;
                color: #2f2f2f;
            }

            time.icon:hover, time.icon:focus {
                -webkit-animation: swing 0.6s ease-out;
                animation: swing 0.6s ease-out;
            }

    @-webkit-keyframes swing {
        0% {
            -webkit-transform: rotate(0deg) skewY(0deg);
        }

        20% {
            -webkit-transform: rotate(12deg) skewY(4deg);
        }

        60% {
            -webkit-transform: rotate(-9deg) skewY(-3deg);
        }

        80% {
            -webkit-transform: rotate(6deg) skewY(-2deg);
        }

        100% {
            -webkit-transform: rotate(0deg) skewY(0deg);
        }
    }

    @keyframes swing {
        0% {
            transform: rotate(0deg) skewY(0deg);
        }

        20% {
            transform: rotate(12deg) skewY(4deg);
        }

        60% {
            transform: rotate(-9deg) skewY(-3deg);
        }

        80% {
            transform: rotate(6deg) skewY(-2deg);
        }

        100% {
            transform: rotate(0deg) skewY(0deg);
        }
    }
</style>
