# Grafana unified-alerting rules for scraper-health regressions.
#
# Dashboard-as-code companion to scraper-health.json. These rules baseline each
# run against the trailing-N-run rolling average of the persisted scraper-health
# tables (scraper_runs, scraper_run_clubs, scraper_run_errors) and fire to
# Discord on a regression — replacing the unconditional per-run Discord summary
# the scraper used to post after every run (gated off in TASK-2511). A healthy
# run produces no Discord post; Discord now carries only failures and regressions.
#
# PRECOMPUTED READS (TASK-3573): rules 1, 2, 2b, and 3 no longer recompute their
# last-two-run / trailing-window / 30-day-history CTEs on every (hourly) Grafana
# evaluation. They SELECT from three small materialized views
# (mv_scraper_health_overall, mv_scraper_health_dropped_to_zero,
# mv_scraper_health_consecutive_zero) that the scraper REFRESHes once at the end
# of each full 'scraper' run. The view definitions ARE the former inline CTEs, so
# the regression semantics are identical — an alert only changes state when a new
# run lands, which is exactly when the refresh happens. To widen/narrow the
# trailing window, change the rn bounds in the view SQL — but note the migration
# below uses CREATE MATERIALIZED VIEW IF NOT EXISTS, so editing it in place and
# re-applying is a no-op (the view already exists) and a REFRESH does not pick up
# a definition change. A window change requires a NEW migration that DROPs and
# recreates the affected view(s), not an edit here or to the existing migration.
# Rule 5 (staleness) stays an inline live query — it measures NOW() - MAX(run) and
# must not be frozen at run time. Migrations:
# apps/scraper/migrations/20260703_scraper_health_summary_materialized_views.sql
# (original definitions), 20260704_scraper_health_club_labels_stable_series.sql
# (TASK-2834: recreates the two club-level views with a club_id label for the
# Discord template's scraper-verify next step, and one-extra-run series
# retention), and 20260706174000_retune_consecutive_zero_health_alert.sql
# (TASK-3584: narrows the self-healing consecutive-zero view to clubs whose
# zero-output state also has a current failure/bot-block signal or existing
# future inventory, avoiding pages for aggregate one-off listings that simply
# aged out). NOT one-row-per-club: Grafana's evaluator caps a query at 1000
# series and the latest run spans ~1,559 clubs.
#
# N defaults to a trailing window of 7 runs (rows rn BETWEEN 2 AND 8: the 7 runs
# immediately preceding the latest), set in the materialized-view definitions.
#
# Provisioning (self-hosted Grafana): drop this file in
# /etc/grafana/provisioning/alerting/ and restart. On Grafana Cloud (no file
# provisioning) the alert rules are reconciled AUTOMATICALLY on every merge to
# main touching this file: the grafana-provision GitHub Actions workflow runs
# provision_alert_rules.py against the Alerting provisioning HTTP API
# (TASK-3580). Only the contactPoints/templates/policies blocks stay manual —
# see apps/web/monitoring/grafana/README.md.
#
# datasourceUid below is the UID of the Neon (grafana_ro) Postgres datasource in
# the aiqobservability Grafana Cloud stack (`dfnjxqagicw74a`). Grafana treats a
# datasource UID as immutable, so it cannot be renamed to a friendlier value
# after creation — this is the real, stable UID. If the datasource is ever
# recreated, replace every `dfnjxqagicw74a` occurrence below with the new UID.

apiVersion: 1

# ---------------------------------------------------------------------------
# Contact point: Discord. Additive and safe to provision (does not replace the
# org notification policy). Set the webhook URL out-of-band — never commit it.
# ---------------------------------------------------------------------------
contactPoints:
  - orgId: 1
    name: scraper-health-discord
    receivers:
      - uid: scraper-health-discord
        type: discord
        disableResolveMessage: false
        settings:
          # Replace with the #laughtrack Discord channel incoming-webhook URL,
          # or provision via an env-substituted secret. Do NOT append /slack.
          message: '{{ template "scraper_health.discord.message" . }}'
          url: REPLACE_WITH_DISCORD_WEBHOOK_URL

# Custom notification template for the scraper-health-discord contact point
# (TASK-2834): leads with the club name and the rule's summary/description and
# renders a concrete next step (dispatch scraper-verify for club_id=NNN) instead
# of the default Alertmanager label dump. NOTE: the grafana-provision CI
# workflow reconciles ALERT RULES only — templates and contact points are not
# auto-provisioned, so keep this block in sync manually with Grafana Cloud:
# Alerting -> Contact points -> the Discord contact point -> Message
# (template scraper-health-discord-message, created 2026-06-12).
templates:
  - orgId: 1
    name: scraper-health-discord-message
    template: |
      {{ define "scraper_health.discord.message" -}}
      {{ if gt (len .Alerts.Firing) 0 -}}
      **Scraper health: {{ len .Alerts.Firing }} firing**
      {{ else -}}
      **Scraper health: recovered**
      {{ end }}
      {{ range .Alerts.Firing -}}
      **{{ or .Labels.club .Labels.alertname }}** - {{ .Annotations.summary }}
      {{ if .Annotations.description }}{{ .Annotations.description }}{{ end }}
      {{ if .Labels.club_id }}Next: dispatch `scraper-verify` for club_id={{ .Labels.club_id }} and check the Scraper Health dashboard.{{ else }}Next: check the Scraper Health dashboard for the affected run and clubs.{{ end }}
      {{ end -}}
      {{ range .Alerts.Resolved -}}
      **Resolved:** {{ or .Labels.club .Labels.alertname }} - {{ .Annotations.summary }}
      {{ if .Labels.club_id }}Next: confirm shows are back for club_id={{ .Labels.club_id }}.{{ else }}Next: confirm the dashboard has returned to baseline.{{ end }}
      {{ end -}}
      {{- end }}

# Route scraper-health alerts to Discord. Provisioned `policies` REPLACE the org
# root policy tree, so this is commented out by default to avoid clobbering an
# existing setup. Either uncomment and set `receiver` to your real default
# receiver, or (recommended) add the equivalent nested route in the Grafana UI:
#   matcher  service = scraper-health   →   contact point  scraper-health-discord
#
# policies:
#   - orgId: 1
#     receiver: grafana-default-email      # <-- set to your existing default receiver
#     routes:
#       - receiver: scraper-health-discord
#         object_matchers:
#           - ['service', '=', 'scraper-health']
#         group_by: ['alertname', 'club']

# ---------------------------------------------------------------------------
# Alert rules.
# ---------------------------------------------------------------------------
groups:
  - orgId: 1
    name: scraper-health-regressions
    folder: Scraper Health
    # The scraper runs nightly at 21:00 UTC. Evaluating these Postgres-backed
    # rules hourly was a top Neon compute consumer without adding much signal:
    # run-regression conditions only change when a new scrape row lands. Six
    # hours keeps multiple checks per day and preserves the 26h stale-run guard
    # while cutting scheduled alert SQL volume by roughly 83%.
    interval: 6h
    rules:
      # 1) Overall success-rate regression: latest run's success_rate is more
      #    than 10 percentage points below the trailing-7-run rolling average.
      # uid matches the LIVE Grafana Cloud rule (created via the UI with a
      # random uid before provisioning was automated) so provision_alert_rules.py
      # matches by uid instead of falling back to exact-title matching.
      - uid: dfnkhyi767z7kc
        title: Scraper success-rate regression (vs trailing-7-run average)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          service: scraper-health
          severity: warning
        annotations:
          summary: Scrape success-rate dropped vs rolling average
          description: >
            The latest scrape run's overall success-rate is more than 10
            percentage points below the average of the previous 7 runs. Check
            the Scraper Health dashboard for which clubs regressed.
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: dfnjxqagicw74a
            model:
              refId: A
              format: table
              rawSql: |
                -- Reads the precomputed mv_scraper_health_overall materialized
                -- view (TASK-3573) instead of rescanning scraper_runs on every
                -- evaluation. The scraper REFRESHes it once per full 'scraper'
                -- run; the view definition is the exact rolling-baseline CTE this
                -- rule used to inline (trailing-7-run average rn BETWEEN 2 AND 8
                -- vs the latest run, run_type='scraper' only), so the alert
                -- semantics are unchanged. See
                -- apps/scraper/migrations/20260703_scraper_health_summary_materialized_views.sql.
                SELECT success_rate_drop FROM mv_scraper_health_overall;
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [10]

      # 2) A club dropped from above-zero to zero shows in the latest run.
      #    The query detects the *transition* (prev run > 0, latest run = 0), so
      #    it fires exactly once per drop: on the next run the previous run is
      #    itself 0, the transition no longer holds, and the alert resolves.
      #    One series per club (club + club_id labels) → one alert instance per
      #    club. The view keeps a club's series for one extra run after the
      #    transition clears (0/1 flag, TASK-2834), so a firing club's series
      #    flips 1 → 0 and resolves as Normal instead of vanishing into a
      #    MissingSeries resolution — Discord only sees meaningful state
      #    changes, not series churn.
      # uid matches the LIVE Grafana Cloud rule (see note on rule 1).
      - uid: afnki3kbq794wa
        title: Club dropped from above-zero to zero shows
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          service: scraper-health
          severity: warning
        annotations:
          summary: '{{ $labels.club }} dropped to zero shows'
          description: >
            {{ $labels.club }} returned shows in the previous run but zero in the
            latest run. This is a silent regression (the run may still report
            success) — verify the venue's calendar and scraper.
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: dfnjxqagicw74a
            model:
              refId: A
              format: table
              rawSql: |
                -- Reads the precomputed mv_scraper_health_dropped_to_zero
                -- materialized view (TASK-3573) instead of recomputing the
                -- last-two-run per-club comparison on every evaluation. The
                -- scraper REFRESHes it once per full 'scraper' run. The firing
                -- condition is the exact prev>0 -> latest=0 transition this rule
                -- used to inline (run_type='scraper', num_shows SUMmed per club),
                -- so it fires exactly once per drop; since TASK-2834 the view
                -- retains a fired club's series (0-valued, + club_id label) for
                -- one extra run so recoveries resolve as Normal, not
                -- MissingSeries. See
                -- apps/scraper/migrations/20260704_scraper_health_club_labels_stable_series.sql.
                SELECT club, club_id, dropped_to_zero FROM mv_scraper_health_dropped_to_zero;
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # 2b) Self-healing companion to rule 2 (TASK-2832): a club has 0 shows in
      #    the last 2 consecutive *full* scrape runs but had >0 shows within the
      #    trailing 30 days. Rule 2 detects the prev>0 → latest=0 *transition*
      #    and fires exactly once by design — if that single evaluation is
      #    missed (the TASK-2824 ImprovCity incident: a 1-club verify run
      #    polluted the rn=1/rn=2 comparison window on Jun 10), the outage
      #    stays invisible forever while the club sits at zero. This rule is
      #    stateful-condition rather than transition-based: it keeps firing on
      #    every evaluation until the club recovers, so a missed evaluation
      #    only delays the alert by one interval. The 30-day >0 lookback keeps
      #    legitimately dark venues (EMPTY_CALENDAR clubs that never had
      #    shows) out of the alert. Single-club verify runs are kept out of the
      #    consecutive-run window two ways: TASK-2831 now persists them with
      #    run_type='verify' (so the run_type='scraper' filter alone excludes
      #    them), and clubs_processed > 1 remains as defense-in-depth for any
      #    legacy rows written before that change. TASK-3584 narrows this rule
      #    further: a 2-run zero only pages when the latest/previous run failed,
      #    detected a bot block, or the DB still has future shows for the club.
      #    That removes one-off aggregate listings that aged out cleanly.
      # uid matches the LIVE Grafana Cloud rule (see note on rule 1).
      - uid: scraper-club-consec-zero-shows
        title: Club at zero shows for 2+ full runs with active regression signal
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          service: scraper-health
          severity: warning
        annotations:
          summary: '{{ $labels.club }} has had zero shows for 2+ full runs with an active regression signal'
          description: >
            {{ $labels.club }} returned zero shows in the last 2 consecutive
            full scrape runs, had shows within the trailing 30 days, and either
            failed/bot-blocked recently or still has future shows in the DB.
            This self-healing rule catches drops whose one-shot transition alert
            (rule 2) was missed while ignoring cleanly empty aggregate listings.
            Verify the venue's calendar and scraper.
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: dfnjxqagicw74a
            model:
              refId: A
              format: table
              rawSql: |
                -- Reads the precomputed mv_scraper_health_consecutive_zero
                -- materialized view (TASK-3573) instead of recomputing the
                -- full_runs / club_shows / 30-day history CTEs on every
                -- evaluation. The scraper REFRESHes it once per full 'scraper'
                -- run. TASK-3584 retuned the view so the self-healing condition
                -- still requires the last 2 consecutive full runs at zero and a
                -- run_type IN ('scraper','verify') 30-day >0 lookback, but also
                -- requires an active regression signal: recent failure, recent
                -- bot block, or existing future shows in the DB. Since TASK-2834
                -- the view retains a fired club's series (0-valued, + club_id
                -- label) for one extra run so recoveries resolve as Normal, not
                -- MissingSeries. The 30-day NOW() anchor is baked at REFRESH time
                -- (latest-run wall-clock), which tracks the daily cadence. See
                -- apps/scraper/migrations/20260706174000_retune_consecutive_zero_health_alert.sql.
                SELECT club, club_id, consecutive_zero FROM mv_scraper_health_consecutive_zero;
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      # 3) Error-count spike: the latest run logged more than 5 errors above the
      #    trailing-7-run rolling average error count.
      # uid matches the LIVE Grafana Cloud rule (see note on rule 1).
      - uid: efnkhoz6eowe8e
        title: Scraper error-count spike (vs trailing-7-run average)
        condition: C
        for: 0m
        noDataState: OK
        execErrState: Alerting
        labels:
          service: scraper-health
          severity: warning
        annotations:
          summary: Scrape error count spiked vs rolling average
          description: >
            The latest scrape run logged more than 5 errors above the average of
            the previous 7 runs. Check the Error count and Bot-block panels on the
            Scraper Health dashboard.
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: dfnjxqagicw74a
            model:
              refId: A
              format: table
              rawSql: |
                -- Reads the precomputed mv_scraper_health_overall materialized
                -- view (TASK-3573) instead of rescanning scraper_runs +
                -- scraper_run_errors on every evaluation. The scraper REFRESHes it
                -- once per full 'scraper' run; error_spike is the exact
                -- latest-vs-trailing-7-run error-count baseline this rule used to
                -- inline (run_type='scraper' only), so the alert is unchanged. See
                -- apps/scraper/migrations/20260703_scraper_health_summary_materialized_views.sql.
                SELECT error_spike FROM mv_scraper_health_overall;
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      # 4) Pipeline liveness / staleness: no successful full scrape run has
      #    landed in over ~26h. Unlike rules 1-3, which baseline the LATEST run
      #    against prior runs and therefore go silent when the pipeline fails to
      #    run AT ALL (the run writes no scraper_runs row, so "latest" never
      #    advances), this rule is failure-mode-agnostic: it alerts whenever the
      #    newest run is too old, for ANY reason the pipeline stopped producing
      #    data — a pre-scrape migrate failure (TASK-3036: a stale
      #    clubs.scraping_url assignment in an onboarding migration failed the
      #    migrate step before the scrape and silently skipped 4 nightly runs),
      #    a setup/dependency failure, a disabled schedule, etc.
      #
      #    The nightly cadence is daily (21:00 UTC), so hours_stale cycles 0->24
      #    between healthy runs; the 26h threshold gives a ~2h grace past the
      #    expected cadence so a single missed run fires without flapping on
      #    normal run-to-run jitter. noDataState is **Alerting** (not OK like the
      #    regression rules): an empty scraper_runs table is itself an outage
      #    signal here, not a healthy "nothing to compare" state.
      - uid: scraper-pipeline-staleness
        title: Scraper pipeline stale — no successful run in 26h
        condition: C
        for: 0m
        noDataState: Alerting
        execErrState: Alerting
        labels:
          service: scraper-health
          severity: critical
        annotations:
          summary: No successful scraper run in over 26h
          description: >
            The newest full scrape run (scraper_runs.run_type='scraper') is more
            than 26 hours old, so the nightly pipeline has missed at least one run
            for some reason — a pre-scrape failure (migrate/setup), a disabled
            schedule, or a hung job. Unlike the regression rules this fires even
            when no new run row was written at all. Check the latest
            scraper-schedule.yml run on GitHub Actions.
        data:
          - refId: A
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: dfnjxqagicw74a
            model:
              refId: A
              format: table
              rawSql: |
                -- Hours since the newest real full scrape run. run_type='scraper'
                -- excludes generic 'pipeline' rows (record_pipeline_run.py writes
                -- one with if: always() even on a failed run — counting it would
                -- mask the very outage this rule exists to catch) and single-club
                -- 'verify' runs. Returns one row; an empty scraper_runs table
                -- yields NO row -> NoData -> Alerting (see noDataState above).
                SELECT EXTRACT(EPOCH FROM (NOW() - MAX(exported_at))) / 3600.0
                       AS hours_stale
                FROM scraper_runs
                WHERE run_type = 'scraper';
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [26]
